[project]
name = "kimi-websearch-mcp"
version = "0.1.0"
description = "Provider-neutral WebSearch and WebFetch MCP tools backed by Kimi APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx2>=2.5.0,<3",
  "mcp>=2.0.0,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
kimi-websearch-mcp = "kimi_websearch_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kimi_websearch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
